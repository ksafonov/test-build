[project]
name = "test-build"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
test-build = "test_build.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/test_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.4.0",
]
